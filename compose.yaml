name: carepoint

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: doctor_appointment_db
      MYSQL_USER: clinic_app
      MYSQL_PASSWORD: ${CAREPOINT_MYSQL_PASSWORD:-carepoint-local-db}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${CAREPOINT_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" --password=\"$$MYSQL_PASSWORD\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' > /dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  mysql-data:
