spring.application.name=doctor-appointment
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/doctor_appointment_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.mvc.problemdetails.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.data.web.pageable.max-page-size=100
springdoc.paths-to-match=/api/v1/**
app.clinic-zone=${CLINIC_ZONE:Asia/Kolkata}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.jwt-secret=${JWT_SECRET}
app.jwt-ttl=${JWT_TTL:PT30M}
app.cancellation-cutoff=${CANCELLATION_CUTOFF:PT24H}
app.reset-ttl=${PASSWORD_RESET_TTL:PT30M}
app.reset-url=${PASSWORD_RESET_URL:${app.frontend-origin}/reset-password}
app.mail-from=${MAIL_FROM:no-reply@example.com}
app.admin-email=${ADMIN_EMAIL:}
app.admin-password=${ADMIN_PASSWORD:}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
